name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'android/**'
      - 'server/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Sync Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets/public
          npx cap sync android 2>&1 | tee sync.log || {
            echo "### ❌ Capacitor Sync Error Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/AscensionProtocol.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscensionProtocol-APK
          path: release-artifacts/AscensionProtocol.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Ascension Protocol Latest Build (${{ github.sha }})"
          body: |
            ## 🚀 Ascension Protocol - Native Mobile Android Release
            
            This release was automatically built and verified on push to `main`.
            
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `main`
            - **Package:** `in.ascensions.app`
            
            ### 📲 Direct Download
            Download [AscensionProtocol.apk](https://github.com/kamaleshramesh7275-cloud/ascension-protocol/releases/latest/download/AscensionProtocol.apk) directly to your Android device to install or update.
          files: release-artifacts/AscensionProtocol.apk
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
