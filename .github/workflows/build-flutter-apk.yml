name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release --verbose

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-artifacts/AscensionProtocol-Flutter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscensionProtocol-Flutter-APK
          path: release-artifacts/AscensionProtocol-Flutter.apk

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: release-artifacts/AscensionProtocol-Flutter.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
