name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Setup Firebase Configuration
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > mobile/android/app/google-services.json
          elif [ ! -f mobile/android/app/google-services.json ]; then
            echo '{"project_info":{"project_number":"1077180336436","project_id":"ascension-957b6","storage_bucket":"ascension-957b6.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1077180336436:android:aaccee1bc72d482203bd61","android_client_info":{"package_name":"in.ascensions.app"}},"oauth_client":[{"client_id":"1077180336436-ah94p7rvqirst2htnsfk91peo3tf8tdc.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForCIBranchesOnly00000"}],"services":{}}],"configuration_version":"1"}' > mobile/android/app/google-services.json
          fi

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-artifacts/AscensionProtocol-Flutter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AscensionProtocol-Flutter-APK
          path: release-artifacts/AscensionProtocol-Flutter.apk

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: release-artifacts/AscensionProtocol-Flutter.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
